name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install
        run: npm ci
      - name: Build
        env:
          # Project site. Do not use configure-pages base_path here: before Pages
          # is enabled it is empty, and the gallery would request /thumbs/*.jpg.
          VITE_BASE: /vfx-studio/
        run: npm run build
      - name: Check gallery thumbnails
        run: |
          test "$(find dist/thumbs -type f -name '*.jpg' | wc -l)" -eq 12
          grep -R --include='*.js' -q '/vfx-studio/' dist/assets
          grep -R --include='*.js' -q 'thumbs/' dist/assets
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
